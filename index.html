<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia do Anderson | Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d4af37;
            --dark: #1a1a1a;
            --dark-light: #2a2a2a;
            --text-light: #f4f4f4;
            --accent: #8b0000;
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1?q=80&w=1470') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-light);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: rgba(26, 26, 26, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(10px);
        }

        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { 
            font-family: 'Playfair Display', serif;
            color: var(--primary); 
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .avatar-upload {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            overflow: hidden;
            background: #444;
        }

        .avatar-upload img { width: 100%; height: 100%; object-fit: cover; }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            background: var(--dark-light);
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        input:focus { border-color: var(--primary); outline: none; background: #333; }

        button {
            background: var(--primary);
            color: var(--dark);
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
            filter: brightness(1.1);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .hero-img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .profile-info {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 20px;
        }

        .footer-info {
            margin-top: 20px;
            font-size: 0.85em;
            color: #888;
            padding: 15px;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="step1" class="step active">
            <h2>Bem-vindo</h2>
            <p style="margin-bottom:20px; font-size: 0.9em;">Acesse sua conta para agendar</p>
            <input type="text" placeholder="Usuário" id="user">
            <input type="password" placeholder="Senha" id="pass">
            <button onclick="login()">Entrar</button>
            <p style="font-size: 12px; margin-top: 15px; color: #666;">Esqueceu a senha?</p>
        </div>

        <div id="step2" class="step">
            <div class="avatar-upload">
                <img id="profilePic" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Perfil">
            </div>
            <h2 id="welcomeUser">Olá, Cliente!</h2>
            <p class="profile-info">Membro Premium</p>
            
            <button onclick="nextStep(3)">Agendar Agora</button>
            <button class="btn-outline" onclick="nextStep('editProfile')">Editar Perfil</button>
            
            <div class="footer-info">
                📍 Rua da Elegância, 123<br>
                🕒 07h às 18h
            </div>
        </div>

        <div id="editProfile" class="step">
            <h2>Editar Perfil</h2>
            <label style="font-size: 12px; display: block; text-align: left;">Alterar Nome:</label>
            <input type="text" id="newName" placeholder="Seu nome">
            <label style="font-size: 12px; display: block; text-align: left;">URL da Foto:</label>
            <input type="text" id="newPic" placeholder="Link da imagem">
            <button onclick="saveProfile()">Salvar Alterações</button>
            <button class="btn-outline" onclick="nextStep(2)">Voltar</button>
        </div>

        <div id="step3" class="step">
            <h2>O Barbeiro</h2>
            <select id="profissional">
                <option value="Anderson">Anderson (Master)</option>
                <option value="Junior">Junior (Especialista)</option>
            </select>
            <button onclick="nextStep(4)">Próximo</button>
            <button class="btn-outline" onclick="nextStep(2)">Voltar</button>
        </div>

        <div id="step4" class="step">
            <h2>O Serviço</h2>
            <select id="servico">
                <option value="Corte de Cabelo (R$ 45,00)">Cabelo Moderno - R$ 45,00</option>
                <option value="Barba Tradicional (R$ 30,00)">Barba e Toalha Quente - R$ 30,00</option>
                <option value="Combo Completo (R$ 65,00)">Experiência Completa - R$ 65,00</option>
            </select>
            <button onclick="nextStep(5)">Próximo</button>
        </div>

        <div id="step5" class="step">
            <h2>Data e Hora</h2>
            <input type="date" id="dia_semana">
            <select id="horario">
                <option value="09:00">09:00</option>
                <option value="10:00">10:00</option>
                <option value="14:00">14:00</option>
                <option value="16:00">16:00</option>
            </select>
            <button onclick="nextStep(6)">Revisar</button>
        </div>

        <div id="step6" class="step">
            <h2>Quase lá!</h2>
            <textarea id="obs" rows="3" placeholder="Alguma preferência?"></textarea>
            <button onclick="sendWhatsApp()">Confirmar no WhatsApp</button>
            <button class="btn-outline" onclick="nextStep(2)">Cancelar</button>
        </div>

    </div>

    <script>
        function nextStep(stepId) {
            document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
            if(typeof stepId === 'number'){
                document.getElementById('step' + stepId).classList.add('active');
            } else {
                document.getElementById(stepId).classList.add('active');
            }
        }

        function login() {
            const user = document.getElementById('user').value;
            if(user) {
                document.getElementById('welcomeUser').innerText = "Olá, " + user + "!";
                nextStep(2);
            } else {
                alert("Por favor, digite seu usuário.");
            }
        }

        function saveProfile() {
            const name = document.getElementById('newName').value;
            const pic = document.getElementById('newPic').value;
            
            if(name) document.getElementById('welcomeUser').innerText = "Olá, " + name + "!";
            if(pic) document.getElementById('profilePic').src = pic;
            
            nextStep(2);
        }

        function sendWhatsApp() {
            const profissional = document.getElementById('profissional').value;
            const servico = document.getElementById('servico').value;
            const dia = document.getElementById('dia_semana').value;
            const horario = document.getElementById('horario').value;
            const obs = document.getElementById('obs').value;
            const numero = "553399506119";

            const mensagem = `*Agendamento Barbearia*%0A` +
                             `*Barbeiro:* ${profissional}%0A` +
                             `*Serviço:* ${servico}%0A` +
                             `*Data:* ${dia}%0A` +
                             `*Hora:* ${horario}%0A` +
                             `*Obs:* ${obs}`;

            window.open(`https://api.whatsapp.com/send?phone=${numero}&text=${mensagem}`, '_blank');
        }
    </script>
</body>
</html>

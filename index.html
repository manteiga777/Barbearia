<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barbearia do Anderson</title>
    <style>
        /* Estilização focada em Mobile e Estilo Vintage Moderno */
        :root {
            --gold: #d4af37;
            --dark: #2c1e14;
            --wood: #3d2b1f;
            --cream: #f2e8cf;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--dark);
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            color: var(--cream);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--wood);
            padding: 25px;
            border: 3px solid var(--gold);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
        }

        .step { display: none; }
        .step.active { display: block; }

        h2 { color: var(--gold); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }

        /* Login e Inputs */
        input, select, textarea {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: var(--cream);
            border: none;
            border-radius: 8px;
            font-size: 16px; /* Evita zoom automático no iOS */
        }

        /* Foto de Perfil */
        .profile-section { margin-bottom: 20px; }
        #preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold);
            margin-bottom: 10px;
            display: none;
        }
        .custom-file-upload {
            display: inline-block;
            padding: 10px 20px;
            background: transparent;
            border: 1px dashed var(--gold);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        /* Grade de Horários (O diferencial que você pediu) */
        .time-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .time-slot {
            background: #1a110a;
            border: 1px solid var(--gold);
            padding: 12px 5px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .time-slot.selected {
            background: var(--gold);
            color: var(--dark);
        }

        /* Botões */
        button {
            background-color: #8b0000;
            color: white;
            border: none;
            padding: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-size: 16px;
            text-transform: uppercase;
        }
        button:active { transform: scale(0.98); }
        .btn-back { background: #555; margin-top: 10px; padding: 12px; }

        .price { color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="step1" class="step active">
            <h2>Bem-vindo</h2>
            <div class="profile-section">
                <img id="preview" src="#" alt="Sua Foto">
                <label class="custom-file-upload">
                    <input type="file" id="foto" accept="image/*" style="display:none" onchange="loadPhoto(event)">
                    📷 Escolher Foto da Galeria
                </label>
            </div>
            <input type="text" id="nome_user" placeholder="Seu Nome">
            <button onclick="saveUser()">Entrar no Sistema</button>
        </div>

        <div id="step2" class="step">
            <h2>O que vamos fazer?</h2>
            <p id="greeting"></p>
            <select id="servico">
                <option value="Corte de Cabelo (R$ 35,00)">Corte de Cabelo - R$ 35,00</option>
                <option value="Barba Tradicional (R$ 25,00)">Barba - R$ 25,00</option>
                <option value="Combo (R$ 55,00)">Corte + Barba - R$ 55,00</option>
            </select>
            <select id="profissional">
                <option value="Anderson">Barbeiro Anderson</option>
                <option value="Junior">Barbeiro Junior</option>
            </select>
            <button onclick="nextStep(3)">Escolher Horário</button>
            <button class="btn-back" onclick="nextStep(1)">Sair</button>
        </div>

        <div id="step3" class="step">
            <h2>Escolha o Horário</h2>
            <p>Toque em um horário livre:</p>
            
            <div class="time-grid" id="grid">
                <div class="time-slot" onclick="selectTime(this)">08:00</div>
                <div class="time-slot" onclick="selectTime(this)">09:00</div>
                <div class="time-slot" onclick="selectTime(this)">10:00</div>
                <div class="time-slot" onclick="selectTime(this)">13:00</div>
                <div class="time-slot" onclick="selectTime(this)">14:00</div>
                <div class="time-slot" onclick="selectTime(this)">15:00</div>
                <div class="time-slot" onclick="selectTime(this)">16:00</div>
                <div class="time-slot" onclick="selectTime(this)">17:00</div>
                <div class="time-slot" onclick="selectTime(this)">18:00</div>
            </div>

            <button onclick="nextStep(4)">Confirmar Horário</button>
            <button class="btn-back" onclick="nextStep(2)">Voltar</button>
        </div>

        <div id="step4" class="step">
            <h2>Finalizar</h2>
            <textarea id="obs" rows="3" placeholder="Alguma observação?"></textarea>
            <button onclick="sendWhatsApp()">Confirmar via WhatsApp</button>
            <button class="btn-back" onclick="nextStep(3)">Mudar Horário</button>
        </div>

    </div>

    <script>
        let selectedTime = "";

        function nextStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + n).classList.add('active');
        }

        // Função para carregar a foto da galeria
        function loadPhoto(event) {
            const output = document.getElementById('preview');
            output.src = URL.createObjectURL(event.target.files[0]);
            output.style.display = 'inline-block';
        }

        function saveUser() {
            const nome = document.getElementById('nome_user').value;
            if(nome === "") return alert("Por favor, digite seu nome");
            document.getElementById('greeting').innerText = "Olá, " + nome + "! Escolha seu serviço:";
            nextStep(2);
        }

        // Função para selecionar o horário apenas clicando
        function selectTime(element) {
            // Remove seleção anterior
            document.querySelectorAll('.time-slot').forEach(slot => slot.classList.remove('selected'));
            // Adiciona seleção ao atual
            element.classList.add('selected');
            selectedTime = element.innerText;
        }

        function sendWhatsApp() {
            if(!selectedTime) return alert("Por favor, clique em um horário!");

            const nome = document.getElementById('nome_user').value;
            const profissional = document.getElementById('profissional').value;
            const servico = document.getElementById('servico').value;
            const obs = document.getElementById('obs').value;
            const numero = "553399506119";

            const msg = `*NOVO AGENDAMENTO*%0A` +
                        `*Cliente:* ${nome}%0A` +
                        `*Barbeiro:* ${profissional}%0A` +
                        `*Serviço:* ${servico}%0A` +
                        `*Horário:* ${selectedTime}%0A` +
                        `*Obs:* ${obs}`;

            window.open(`https://api.whatsapp.com/send?phone=${numero}&text=${msg}`, '_blank');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barbearia Anderson | Black & White</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --gray-light: #f2f2f2;
            --gray-medium: #888888;
            --border: #dddddd;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
        }

        /* Emoji de Tesoura Transparente no Fundo */
        .container::before {
            content: "✂️";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 250px;
            opacity: 0.03; /* Transparência profunda */
            pointer-events: none;
            z-index: -1;
        }

        .step { display: none; animation: fadeIn 0.3s ease; }
        .step.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h2 { 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            margin-bottom: 30px;
            border-bottom: 2px solid var(--text);
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Avatar */
        #preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--text);
            margin-bottom: 15px;
            display: none;
        }

        .custom-file-upload {
            display: block;
            margin: 10px auto 30px;
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
            color: var(--gray-medium);
        }

        /* Inputs */
        input, select, textarea {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: var(--bg);
            border: 1px solid var(--text);
            border-radius: 0; /* Estilo quadrado minimalista */
            font-size: 16px;
            color: var(--text);
        }

        /* Grade de Horários P&B */
        .time-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 20px 0;
        }
        .time-slot {
            border: 1px solid var(--text);
            padding: 15px 0;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }
        .time-slot.selected {
            background: var(--text);
            color: var(--bg);
        }

        /* Botões */
        button {
            background-color: var(--text);
            color: var(--bg);
            border: 1px solid var(--text);
            padding: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:active { background-color: var(--gray-medium); border-color: var(--gray-medium); }

        .btn-outline {
            background: var(--bg);
            color: var(--text);
            margin-top: 10px;
        }

        .info-txt { font-size: 13px; color: var(--gray-medium); margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="step1" class="step active">
            <h2>Anderson</h2>
            <div class="profile-section">
                <img id="preview" src="#" alt="Perfil">
                <label class="custom-file-upload">
                    <input type="file" id="foto" accept="image/*" style="display:none" onchange="loadPhoto(event)">
                    ADICIONAR FOTO DA GALERIA
                </label>
            </div>
            <input type="text" id="nome_user" placeholder="NOME DO CLIENTE">
            <button onclick="saveUser()">CONTINUAR</button>
        </div>

        <div id="step2" class="step">
            <h2>SERVIÇOS</h2>
            <select id="servico">
                <option value="Corte (R$ 35,00)">CORTE - R$ 35,00</option>
                <option value="Barba (R$ 25,00)">BARBA - R$ 25,00</option>
                <option value="Combo (R$ 55,00)">CORTE + BARBA - R$ 55,00</option>
            </select>
            <p class="info-txt">Profissional: Anderson</p>
            <button onclick="nextStep(3)">ESCOLHER HORÁRIO</button>
            <button class="btn-outline" onclick="nextStep(1)">VOLTAR</button>
        </div>

        <div id="step3" class="step">
            <h2>HORÁRIOS</h2>
            <div class="time-grid" id="grid">
                <div class="time-slot" onclick="selectTime(this)">08:00</div>
                <div class="time-slot" onclick="selectTime(this)">09:00</div>
                <div class="time-slot" onclick="selectTime(this)">10:00</div>
                <div class="time-slot" onclick="selectTime(this)">13:00</div>
                <div class="time-slot" onclick="selectTime(this)">14:00</div>
                <div class="time-slot" onclick="selectTime(this)">15:00</div>
                <div class="time-slot" onclick="selectTime(this)">16:00</div>
                <div class="time-slot" onclick="selectTime(this)">17:00</div>
                <div class="time-slot" onclick="selectTime(this)">18:00</div>
            </div>
            <button onclick="nextStep(4)">CONFIRMAR</button>
            <button class="btn-outline" onclick="nextStep(2)">VOLTAR</button>
        </div>

        <div id="step4" class="step">
            <h2>REVISÃO</h2>
            <textarea id="obs" rows="3" placeholder="NOTAS ADICIONAIS..."></textarea>
            <button onclick="sendWhatsApp()">FINALIZAR AGENDAMENTO</button>
            <button class="btn-outline" onclick="nextStep(3)">VOLTAR</button>
        </div>

    </div>

    <script>
        let selectedTime = "";

        function nextStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + n).classList.add('active');
            window.scrollTo(0,0);
        }

        function loadPhoto(event) {
            const output = document.getElementById('preview');
            output.src = URL.createObjectURL(event.target.files[0]);
            output.style.display = 'inline-block';
        }

        function saveUser() {
            const nome = document.getElementById('nome_user').value;
            if(nome === "") return alert("POR FAVOR, INSIRA SEU NOME");
            nextStep(2);
        }

        function selectTime(element) {
            document.querySelectorAll('.time-slot').forEach(slot => slot.classList.remove('selected'));
            element.classList.add('selected');
            selectedTime = element.innerText;
        }

        function sendWhatsApp() {
            if(!selectedTime) return alert("SELECIONE UM HORÁRIO");

            const nome = document.getElementById('nome_user').value;
            const servico = document.getElementById('servico').value;
            const obs = document.getElementById('obs').value;
            const numero = "553399506119";

            const msg = `*AGENDAMENTO P&B*%0A` +
                        `*CLIENTE:* ${nome.toUpperCase()}%0A` +
                        `*BARBEIRO:* ANDERSON%0A` +
                        `*SERVIÇO:* ${servico}%0A` +
                        `*HORÁRIO:* ${selectedTime}%0A` +
                        `*OBS:* ${obs}`;

            window.open(`https://api.whatsapp.com/send?phone=${numero}&text=${msg}`, '_blank');
        }
    </script>
</body>
</html>

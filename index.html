<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mateus | Brutus Barbearia</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #d4af37; /* Dourado/Ouro */
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
            --secondary-text: #b3b3b3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .profile-section {
            margin-bottom: 30px;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--secondary-text);
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            background-color: var(--card-bg);
            border: 1px solid #333;
            padding: 18px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            position: relative;
        }

        .link-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary-color);
            background-color: #222;
        }

        .link-card i {
            font-size: 1.5rem;
            margin-right: 15px;
            color: var(--primary-color);
            width: 30px;
        }

        .link-text {
            text-align: left;
        }

        .link-text span {
            display: block;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .link-text small {
            color: var(--secondary-text);
            font-size: 0.85rem;
        }

        .social-icons {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-icons a {
            color: var(--text-color);
            font-size: 1.5rem;
            transition: color 0.3s;
        }

        .social-icons a:hover {
            color: var(--primary-color);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: var(--secondary-text);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-section">
            <img src="http://googleusercontent.com/image_collection/image_retrieval/17785345201389623605_0" alt="Barbeiro Mateus" class="profile-img">
            <h1>Mateus</h1>
            <p class="subtitle">Especialista em Cortes Modernos e Barba</p>
        </div>

        <div class="links-container">
            <a href="#" class="link-card">
                <i class="fa-regular fa-calendar-check"></i>
                <div class="link-text">
                    <span>Agende seu Horário</span>
                    <small>Reserve via Tua Agenda</small>
                </div>
            </a>

            <a href="https://wa.me/5500000000000" class="link-card">
                <i class="fa-brands fa-whatsapp"></i>
                <div class="link-text">
                    <span>WhatsApp</span>
                    <small>Dúvidas e informações</small>
                </div>
            </a>

            <a href="#" class="link-card">
                <i class="fa-brands fa-instagram"></i>
                <div class="link-text">
                    <span>Meu Portfólio</span>
                    <small>Siga no Instagram</small>
                </div>
            </a>

            <a href="#" class="link-card">
                <i class="fa-solid fa-location-dot"></i>
                <div class="link-text">
                    <span>Localização</span>
                    <small>Brutus Barbearia - Como chegar</small>
                </div>
            </a>
        </div>

        <div class="social-icons">
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
            <a href="#"><i class="fa-brands fa-tiktok"></i></a>
            <a href="#"><i class="fa-solid fa-envelope"></i></a>
        </div>

        <div class="footer">
            <p>&copy; 2024 Brutus Barbearia - Mateus Barber</p>
        </div>
    </div>

</body>
</html>

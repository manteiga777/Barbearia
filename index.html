<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anderson Barber | Premium Booking</title>
    <style>
        :root {
            --pure-black: #000000;
            --pure-white: #ffffff;
            --gray-100: #f8f9fa;
            --gray-300: #dee2e6;
            --gray-800: #343a40;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0; padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--pure-white);
            color: var(--pure-black);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 40px 24px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Tesoura Background Profissional */
        .bg-icon {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 180px;
            opacity: 0.04;
            pointer-events: none;
            z-index: -1;
            user-select: none;
        }

        .step { display: none; width: 100%; }
        .step.active { 
            display: flex; 
            flex-direction: column;
            animation: slideUp 0.4s ease-out; 
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tipografia */
        h1 { font-size: 12px; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 8px; color: var(--gray-800); }
        h2 { font-size: 28px; font-weight: 800; letter-spacing: -1px; margin-bottom: 32px; }

        /* Perfil e Foto */
        .avatar-container {
            margin-bottom: 32px;
            align-self: center;
        }
        #preview {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--pure-black);
            padding: 4px;
            margin-bottom: 12px;
            display: none;
        }
        .upload-label {
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1px solid var(--pure-black);
            padding-bottom: 2px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Formulários */
        input, select, textarea {
            width: 100%;
            padding: 16px 0;
            margin-bottom: 24px;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--gray-300);
            font-size: 16px;
            border-radius: 0;
            transition: var(--transition);
        }
        input:focus { border-bottom-color: var(--pure-black); outline: none; }

        /* Grade de Horários Profissional */
        .time-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        .time-slot {
            padding: 14px 0;
            border: 1px solid var(--gray-300);
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .time-slot:hover { border-color: var(--pure-black); }
        .time-slot.selected {
            background: var(--pure-black);
            color: var(--pure-white);
            border-color: var(--pure-black);
        }

        /* Botões */
        button {
            background: var(--pure-black);
            color: var(--pure-white);
            border: none;
            padding: 20px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }
        button:active { transform: scale(0.98); opacity: 0.9; }

        .btn-secondary {
            background: transparent;
            color: var(--pure-black);
            border: 1px solid var(--pure-black);
            margin-top: 12px;
        }

        .label-small { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--gray-800); margin-bottom: 4px; display: block; text-align: left; }
    </style>
</head>
<body>

    <div class="bg-icon">✂️</div>

    <div class="container">
        
        <div id="step1" class="step active">
            <h1>Premium Service</h1>
            <h2>Bem-vindo</h2>
            
            <div class="avatar-container">
                <img id="preview" src="#" alt="Profile">
                <label class="upload-label">
                    <input type="file" id="foto" accept="image/*" style="display:none" onchange="loadPhoto(event)">
                    Carregar Foto
                </label>
            </div>

            <span class="label-small">Nome Completo</span>
            <input type="text" id="nome_user" placeholder="Ex: Rodrigo Oliveira">
            <button onclick="saveUser()">Próximo</button>
        </div>

        <div id="step2" class="step">
            <h1>Serviços</h1>
            <h2>O que faremos hoje?</h2>
            
            <span class="label-small">Selecione o procedimento</span>
            <select id="servico">
                <option value="Corte de Cabelo">Corte de Cabelo — R$ 35</option>
                <option value="Barba Design">Barba Design — R$ 25</option>
                <option value="Combo Completo">Combo Completo — R$ 55</option>
            </select>

            <span class="label-small" style="margin-top: 10px;">Barbeiro Selecionado</span>
            <p style="font-weight: 700; margin-bottom: 40px;">Anderson Master</p>

            <button onclick="nextStep(3)">Escolher Horário</button>
            <button class="btn-secondary" onclick="nextStep(1)">Voltar</button>
        </div>

        <div id="step3" class="step">
            <h1>Agenda</h1>
            <h2>Horários disponíveis</h2>
            
            <div class="time-grid">
                <div class="time-slot" onclick="selectTime(this)">09:00</div>
                <div class="time-slot" onclick="selectTime(this)">10:00</div>
                <div class="time-slot" onclick="selectTime(this)">11:00</div>
                <div class="time-slot" onclick="selectTime(this)">14:00</div>
                <div class="time-slot" onclick="selectTime(this)">15:00</div>
                <div class="time-slot" onclick="selectTime(this)">16:00</div>
                <div class="time-slot" onclick="selectTime(this)">17:00</div>
                <div class="time-slot" onclick="selectTime(this)">18:00</div>
                <div class="time-slot" onclick="selectTime(this)">19:00</div>
            </div>

            <button onclick="nextStep(4)">Continuar</button>
            <button class="btn-secondary" onclick="nextStep(2)">Voltar</button>
        </div>

        <div id="step4" class="step">
            <h1>Finalização</h1>
            <h2>Algum detalhe?</h2>
            
            <textarea id="obs" rows="4" placeholder="Preferências, estilo de corte ou observações..."></textarea>
            
            <button onclick="sendWhatsApp()">Finalizar Agendamento</button>
            <button class="btn-secondary" onclick="nextStep(3)">Revisar Horário</button>
        </div>

    </div>

    <script>
        let selectedTime = "";

        function nextStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + n).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function loadPhoto(event) {
            const output = document.getElementById('preview');
            output.src = URL.createObjectURL(event.target.files[0]);
            output.style.display = 'block';
            document.querySelector('.upload-label').innerText = 'Trocar Foto';
        }

        function saveUser() {
            const nome = document.getElementById('nome_user').value;
            if(!nome) return alert("Por favor, informe seu nome.");
            nextStep(2);
        }

        function selectTime(element) {
            document.querySelectorAll('.time-slot').forEach(slot => slot.classList.remove('selected'));
            element.classList.add('selected');
            selectedTime = element.innerText;
        }

        function sendWhatsApp() {
            if(!selectedTime) return alert("Selecione um horário para continuar.");

            const nome = document.getElementById('nome_user').value;
            const servico = document.getElementById('servico').value;
            const obs = document.getElementById('obs').value;
            const numero = "553399506119";

            const msg = `*RESERVA PREMIUM - ANDERSON BARBER*%0A%0A` +
                        `*CLIENTE:* ${nome.toUpperCase()}%0A` +
                        `*SERVIÇO:* ${servico}%0A` +
                        `*HORÁRIO:* ${selectedTime}%0A` +
                        `*OBS:* ${obs || 'Nenhuma'}`;

            window.open(`https://api.whatsapp.com/send?phone=${numero}&text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
